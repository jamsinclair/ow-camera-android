name: F-Droid Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tag is on release branch
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch origin release
          if ! git branch -r --contains ${{ github.sha }} | grep -q "origin/release"; then
            echo "Tag is not on the release branch. Skipping."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease

      - name: Set build tools path
        run: |
          BUILD_TOOLS_VERSION=$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)
          echo "BUILD_TOOLS=${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks

      - name: Get tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Zipalign APK
        run: |
          UNSIGNED_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" /tmp/owcamera-${{ steps.tag.outputs.TAG }}-aligned.apk

      - name: Sign APK
        run: |
          $BUILD_TOOLS/apksigner sign \
            --ks /tmp/release.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out /tmp/owcamera-${{ steps.tag.outputs.TAG }}.apk \
            /tmp/owcamera-${{ steps.tag.outputs.TAG }}-aligned.apk

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          generate_release_notes: true
          files: /tmp/owcamera-${{ steps.tag.outputs.TAG }}.apk

      - name: Cleanup sensitive files
        if: always()
        run: rm -f /tmp/release.jks
